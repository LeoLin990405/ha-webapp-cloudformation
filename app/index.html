<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Udagram High Availability Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #101827;
      color: #f8fafc;
    }
    main {
      max-width: 760px;
      padding: 48px;
      text-align: center;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 12px;
    }
    p {
      color: #cbd5e1;
      font-size: 20px;
      line-height: 1.55;
    }
    .badge {
      display: inline-block;
      margin-top: 22px;
      padding: 10px 14px;
      border: 1px solid #38bdf8;
      border-radius: 999px;
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <main>
    <h1>Udagram is running.</h1>
    <p>This page is served by NGINX on EC2 instances in private subnets, behind an internet-facing Application Load Balancer and Auto Scaling group.</p>
    <div class="badge">Deployed with AWS CloudFormation</div>
  </main>
</body>
</html>
