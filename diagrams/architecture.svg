<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Udagram high availability CloudFormation architecture</title>
  <desc id="desc">A two availability-zone VPC with public subnets, NAT gateways, private EC2 web servers, an internet-facing application load balancer, an Auto Scaling group, an IAM instance profile, and a private S3 bucket.</desc>
  <style>
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 10; }
    .group { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 14; }
    .public { fill: #e0f2fe; stroke: #0369a1; }
    .private { fill: #ecfdf5; stroke: #047857; }
    .control { fill: #fef3c7; stroke: #b45309; }
    .text { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 16px; }
    .small { font-size: 13px; fill: #374151; }
    .title { font-size: 22px; font-weight: 700; }
    .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="40" y="42" class="text title">Udagram High Availability Web App</text>
  <rect x="40" y="70" width="1120" height="640" class="group"/>
  <text x="60" y="100" class="text title">AWS Region: us-west-2 / VPC 10.0.0.0/16</text>

  <rect x="80" y="130" width="490" height="430" class="group"/>
  <text x="100" y="162" class="text title">Availability Zone A</text>
  <rect x="110" y="190" width="200" height="90" class="box public"/>
  <text x="130" y="222" class="text">Public Subnet A</text>
  <text x="130" y="248" class="text small">10.0.0.0/24</text>
  <rect x="340" y="190" width="190" height="90" class="box public"/>
  <text x="365" y="222" class="text">NAT Gateway A</text>
  <rect x="110" y="330" width="420" height="180" class="box private"/>
  <text x="130" y="362" class="text">Private Subnet A</text>
  <text x="130" y="388" class="text small">10.0.2.0/24</text>
  <rect x="150" y="420" width="150" height="55" class="box"/>
  <text x="176" y="452" class="text small">EC2 Web Server</text>
  <rect x="340" y="420" width="150" height="55" class="box"/>
  <text x="366" y="452" class="text small">EC2 Web Server</text>

  <rect x="630" y="130" width="490" height="430" class="group"/>
  <text x="650" y="162" class="text title">Availability Zone B</text>
  <rect x="660" y="190" width="200" height="90" class="box public"/>
  <text x="680" y="222" class="text">Public Subnet B</text>
  <text x="680" y="248" class="text small">10.0.1.0/24</text>
  <rect x="890" y="190" width="190" height="90" class="box public"/>
  <text x="915" y="222" class="text">NAT Gateway B</text>
  <rect x="660" y="330" width="420" height="180" class="box private"/>
  <text x="680" y="362" class="text">Private Subnet B</text>
  <text x="680" y="388" class="text small">10.0.3.0/24</text>
  <rect x="700" y="420" width="150" height="55" class="box"/>
  <text x="726" y="452" class="text small">EC2 Web Server</text>
  <rect x="890" y="420" width="150" height="55" class="box"/>
  <text x="916" y="452" class="text small">EC2 Web Server</text>

  <rect x="450" y="78" width="300" height="60" class="box control"/>
  <text x="493" y="114" class="text">Internet Gateway</text>
  <rect x="430" y="585" width="340" height="60" class="box control"/>
  <text x="470" y="621" class="text">Application Load Balancer</text>
  <rect x="120" y="610" width="230" height="60" class="box control"/>
  <text x="148" y="636" class="text">Auto Scaling Group</text>
  <text x="165" y="658" class="text small">Desired/Min/Max: 4</text>
  <rect x="830" y="585" width="250" height="60" class="box control"/>
  <text x="858" y="611" class="text">IAM Instance Profile</text>
  <text x="865" y="633" class="text small">Least-privilege S3 read</text>
  <rect x="830" y="655" width="250" height="50" class="box control"/>
  <text x="880" y="686" class="text">Private S3 Bucket</text>

  <path class="line" d="M600 138 L600 585"/>
  <path class="line" d="M430 615 L310 450"/>
  <path class="line" d="M770 615 L850 450"/>
  <path class="line" d="M310 235 L340 235"/>
  <path class="line" d="M860 235 L890 235"/>
  <path class="line" d="M435 280 L435 330"/>
  <path class="line" d="M985 280 L985 330"/>
  <path class="line" d="M235 610 L225 475"/>
  <path class="line" d="M235 610 L415 475"/>
  <path class="line" d="M235 610 L775 475"/>
  <path class="line" d="M235 610 L965 475"/>
  <path class="line" d="M955 645 L955 655"/>
  <path class="line" d="M830 615 L350 615"/>
</svg>
